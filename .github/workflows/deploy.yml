name: Deploy to Vercel (Production)

# Auto-deploys main to Vercel production using the official Vercel CLI.
# Requires 3 repo secrets:
#   VERCEL_TOKEN      - personal access token (https://vercel.com/account/tokens)
#   VERCEL_ORG_ID     - account / team ID (from `vercel link` -> .vercel/project.json)
#   VERCEL_PROJECT_ID - prj_AD8SgZGA482OcWCWh3UEnFV0gdut (this project)

on:
  push:
    branches: [main]
  workflow_dispatch:   # allows manual trigger from the Actions tab

env:
  VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Build & deploy to production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
